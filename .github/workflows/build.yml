name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        # Perfil dev (H2 en memoria): el runner no tiene el PostgreSQL del
        # perfil docker (bd/compose.yaml). El perfil se fuerza por flag y no
        # editando application.properties (alli el default es docker).
        run: ./mvnw -B verify -Dspring.profiles.active=dev
