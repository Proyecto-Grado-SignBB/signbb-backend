name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Perfil único docker: los @SpringBootTest necesitan PostgreSQL y Redis,
    # así que se levantan como servicios del runner (mismos puertos y
    # credenciales que contenedores/compose.yaml).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: example
          POSTGRES_DB: signbb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d signbb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify
