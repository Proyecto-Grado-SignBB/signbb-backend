name: docs

# Regenera la documentación Doxygen y la commitea a docs/html en la misma
# rama. Solo corre cuando cambian las entradas de las docs (código Java,
# Doxyfile o este workflow) para no gastar runner en cada push.
on:
  push:
    paths:
      - 'backend/src/main/java/**'
      - 'Doxyfile'
      - 'README.md'
      - 'contenedores/MANUAL_CONTENEDORES.md'
      - 'backend/src/test/java/org/signbb/backend/navegacion/README.md'
      - 'backend/src/test/java/org/signbb/backend/autoria/README.md'
      - 'grafo_sistema/**'
      - 'docs/img/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doxygen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Instalar Doxygen 1.18.0
        # Versión fijada: la salida de Doxygen cambia entre versiones (paquetes,
        # numeración); se ancla para que las docs sean reproducibles.
        run: |
          curl -fsSL -o /tmp/doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          tar -xzf /tmp/doxygen.tar.gz -C /tmp
          sudo cp /tmp/doxygen-1.18.0/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Regenerar documentación
        # Se limpia docs/html para no arrastrar páginas obsoletas que Doxygen
        # ya no genera (p. ej. al cambiar opciones como IMPLICIT_DIR_DOCS).
        run: |
          rm -rf docs/html
          doxygen Doxyfile

      - name: Commit y push de docs/html si hay cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/html
          if git diff --cached --quiet; then
            echo "Sin cambios en docs/html"
          else
            git commit -m 'docs: regenerar Doxygen [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
