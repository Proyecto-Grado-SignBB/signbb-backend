openapi: 3.1.0
info:
  title: SignBB API
  description: "API REST del sistema de apoyo al triaje clínico SignBB: consulta guiada\
    \ del padre o acudiente (recorridos), autoría de subgrafos clínicos y reglas,\
    \ revisión del supervisor y cuentas. Ingresa en POST /api/auth/login y usa el\
    \ token en «Authorize»."
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Servidor local (perfil docker)
security:
- bearerAuth: []
tags:
- name: Sesión
  description: "Registro de padres, ingreso con correo y contraseña y usuario actual.\
    \ El token devuelto va en Authorization: Bearer."
- name: Usuarios
  description: "Cuentas clínicas (solo MEDICO_SUPERVISOR): crear médicos y supervisores,\
    \ listarlos y activarlos o desactivarlos."
- name: Revisión
  description: "El médico envía su subgrafo a revisión; un supervisor que no sea el\
    \ autor lo aprueba (y se publica) o lo rechaza con un comentario. El supervisor\
    \ autor publica directamente sus propios subgrafos sin pasar por revisión."
- name: Consulta
  description: "Recorrido guiado del cuidador: inicia el triaje, responde cada pregunta\
    \ y consulta el estado. Toda respuesta queda auditada."
- name: Reglas
  description: "Panel de reglas del médico: arma las bases de reglas asociadas\
    \ a un grafo; se publican junto con el subgrafo (al aprobarlo o al publicarlo\
    \ directamente el supervisor). Las operaciones que editan devuelven el borrador completo. Errores:\
    \ 404 si el recurso no existe; 422 con {mensaje, avisos} si la edición no es vá\
    lida o la base no se puede publicar; 409 si otra persona la cambió."
- name: Autoría
  description: "Lienzo del médico para armar y validar subgrafos clínicos. El supervisor\
    \ autor los publica directamente; los demás médicos, al aprobar su revisión.\
    \ Las operaciones que editan devuelven el borrador completo. Errores: 404 si el\
    \ recurso no existe; 422 con {mensaje, avisos} si la edición no es válida o el\
    \ borrador no se puede publicar; 409 si otra persona lo cambió."
paths:
  /api/auth/registro:
    post:
      tags:
      - Sesión
      summary: Registra un padre o acudiente
      description: "Crea la cuenta con rol PADRE y devuelve la sesión abierta. Las\
        \ cuentas clínicas las crea un supervisor en /api/usuarios."
      operationId: registro
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroRequest"
        required: true
      responses:
        "201":
          description: Cuenta creada y sesión abierta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SesionDTO"
        "422":
          description: "Falta un dato, el correo ya existe o la contraseña tiene menos de 8 caracteres"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
      security: []
  /api/auth/login:
    post:
      tags:
      - Sesión
      summary: Ingresa con correo y contraseña
      description: "Devuelve el token, cuándo vence y la cuenta."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Sesión abierta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SesionDTO"
        "401":
          description: "Correo o contraseña incorrectos, o cuenta inactiva (mismo mensaje en todos los casos)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
      security: []
  /api/auth/yo:
    get:
      tags:
      - Sesión
      summary: Usuario actual
      description: La cuenta dueña del token.
      operationId: yo
      responses:
        "200":
          description: La cuenta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioDTO"
        "401":
          description: "Sin token, token inválido o cuenta inactiva"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/usuarios:
    get:
      tags:
      - Usuarios
      summary: Lista las cuentas clínicas
      description: "Médicos y supervisores, por nombre."
      operationId: listar_usuarios
      responses:
        "200":
          description: Las cuentas
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioDTO"
        "403":
          description: Quien llama no es supervisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
    post:
      tags:
      - Usuarios
      summary: Crea una cuenta clínica
      description: El rol debe ser MEDICO o MEDICO_SUPERVISOR.
      operationId: crear_usuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoUsuarioRequest"
        required: true
      responses:
        "201":
          description: Cuenta creada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioDTO"
        "403":
          description: Quien llama no es supervisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "422":
          description: "Rol PADRE, correo repetido, contraseña corta o falta un dato"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/usuarios/{id}/activo:
    put:
      tags:
      - Usuarios
      summary: Activa o desactiva una cuenta
      description: "Una cuenta inactiva no puede ingresar y sus tokens dejan de servir.\
        \ Un supervisor no puede desactivarse a sí mismo."
      operationId: cambiar_activo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivoRequest"
        required: true
      responses:
        "200":
          description: Cuenta actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioDTO"
        "403":
          description: Quien llama no es supervisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "404":
          description: La cuenta no existe
        "422":
          description: Falta activo o es la propia cuenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/enviar-revision:
    post:
      tags:
      - Revisión
      summary: Envía el subgrafo a revisión
      description: "Solo el autor. Valida los avisos del lienzo y de las reglas como al publicar."
      operationId: enviar_revision
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Subgrafo en revisión (EN_REVISION)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "403":
          description: No es el autor
        "404":
          description: El subgrafo no existe
        "422":
          description: "Hay avisos bloqueantes, ya está en revisión o no tiene cambios: el cuerpo trae los avisos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/retirar-revision:
    post:
      tags:
      - Revisión
      summary: Retira el subgrafo de revisión
      description: "Solo el autor. Vuelve a BORRADOR, o a CAMBIOS_SIN_PUBLICAR si ya estaba publicado."
      operationId: retirar_revision
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Subgrafo fuera de revisión
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "403":
          description: No es el autor
        "404":
          description: El subgrafo no existe
        "422":
          description: No está en revisión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/aprobar:
    post:
      tags:
      - Revisión
      summary: Aprueba y publica el subgrafo
      description: "Solo un supervisor que no sea el autor. Publica el subgrafo y su base de reglas en una sola acción."
      operationId: aprobar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Subgrafo publicado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "403":
          description: Es el autor o no es supervisor
        "404":
          description: El subgrafo no existe
        "422":
          description: No está en revisión o no se puede publicar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/publicar:
    post:
      tags:
      - Autoría
      summary: Publica directamente el subgrafo
      description: "Solo el supervisor autor. Publica el subgrafo y su base de reglas en una sola acción, sin enviarlo a revisión. Se permite desde BORRADOR o CAMBIOS_SIN_PUBLICAR, y también si ya está publicado pero sus reglas tienen cambios sin publicar."
      operationId: publicar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Subgrafo publicado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "403":
          description: No es supervisor o no es el autor
        "404":
          description: El subgrafo no existe
        "422":
          description: No está en un estado publicable o el contenido tiene avisos bloqueantes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/rechazar:
    post:
      tags:
      - Revisión
      summary: Rechaza el subgrafo
      description: "Solo un supervisor que no sea el autor. El comentario es obligatorio."
      operationId: rechazar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechazoRequest"
        required: false
      responses:
        "200":
          description: Subgrafo devuelto al autor con el comentario
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "403":
          description: Es el autor o no es supervisor
        "404":
          description: El subgrafo no existe
        "422":
          description: Falta el comentario o no está en revisión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/revisiones:
    get:
      tags:
      - Revisión
      summary: Lista las revisiones pendientes
      description: Solo supervisor. No incluye los suyos.
      operationId: pendientes
      responses:
        "200":
          description: Subgrafos en revisión
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResumenSubgrafoDTO"
        "403":
          description: Quien llama no es supervisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}:
    get:
      tags:
      - Autoría
      summary: Obtiene un borrador completo
      description: Incluye el lienzo y los avisos calculados en el momento.
      operationId: obtener
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Borrador completo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "404":
          description: El borrador no existe
    put:
      tags:
      - Autoría
      summary: Actualiza los datos del subgrafo
      description: "Cambia nombre, categoría, texto de la opción, autor o institució\
        n."
      operationId: actualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubgrafoRequest"
        required: true
      responses:
        "200":
          description: Borrador actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "404":
          description: El borrador no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "422":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
    delete:
      tags:
      - Autoría
      summary: Elimina un borrador
      description: Solo si nunca se publicó.
      operationId: eliminar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Borrador eliminado
        "404":
          description: El borrador no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/respuestas/{respuestaId}/destino:
    put:
      tags:
      - Autoría
      summary: Enlaza una respuesta a una pregunta existente
      description: La opción "Pregunta existente". Enviar nodoId nulo quita el enlace.
      operationId: enlazar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: respuestaId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinoRequest"
        required: true
      responses:
        "200":
          description: Borrador actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "404":
          description: "El borrador, la respuesta o el nodo destino no existe"
        "422":
          description: "La edición no es válida (por ejemplo, crearía un círculo)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/nodos/{nodoId}:
    put:
      tags:
      - Autoría
      summary: Edita un nodo
      operationId: editarNodo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: nodoId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodoRequest"
        required: true
      responses:
        "200":
          description: Borrador actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "404":
          description: El borrador o el nodo no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "422":
          description: La edición no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
    delete:
      tags:
      - Autoría
      summary: Elimina un nodo y su rama
      description: Las respuestas que llegaban vuelven a quedar como "+".
      operationId: eliminarNodo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: nodoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Borrador actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "404":
          description: El borrador o el nodo no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/bases/{id}:
    get:
      tags:
      - Reglas
      summary: Obtiene un borrador de reglas completo
      description: Incluye las reglas y los avisos calculados en el momento.
      operationId: obtener_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Borrador completo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseReglaDTO"
        "404":
          description: El borrador no existe
    put:
      tags:
      - Reglas
      summary: Actualiza los datos de la base de reglas
      description: "Cambia nombre, autor o institución; el grafo no cambia."
      operationId: actualizar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseReglaRequest"
        required: true
      responses:
        "200":
          description: Borrador actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseReglaDTO"
        "404":
          description: El borrador no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "422":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
    delete:
      tags:
      - Reglas
      summary: Elimina un borrador de reglas
      description: Solo si nunca se publicó.
      operationId: eliminar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Borrador eliminado
        "404":
          description: El borrador no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "422":
          description: La base ya está publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/bases/{id}/reglas/{reglaId}:
    put:
      tags:
      - Reglas
      summary: Edita una regla del borrador
      operationId: editarRegla
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: reglaId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReglaRequest"
        required: true
      responses:
        "200":
          description: Borrador actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseReglaDTO"
        "404":
          description: El borrador o la regla no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "422":
          description: La regla no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
    delete:
      tags:
      - Reglas
      summary: Elimina una regla del borrador
      operationId: eliminarRegla
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: reglaId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Borrador actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseReglaDTO"
        "404":
          description: El borrador o la regla no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/recorridos:
    get:
      tags:
      - Consulta
      summary: Mis recorridos
      description: "Los recorridos del padre o acudiente, del más nuevo al más viejo."
      operationId: misRecorridos
      responses:
        "200":
          description: Los recorridos del usuario actual
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResumenRecorridoDTO"
    post:
      tags:
      - Consulta
      summary: Inicia un recorrido de triaje
      description: Crea una sesión y devuelve la primera pregunta. El id del recorrido
        se envía en el cuerpo y se usa en las operaciones siguientes.
      operationId: iniciar
      responses:
        "200":
          description: Recorrido creado con su primera pregunta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecorridoDTO"
        "503":
          description: Caché de sesiones (Redis) no disponible
  /api/recorridos/{recorridoId}/retroceder:
    post:
      tags:
      - Consulta
      summary: Retrocede a la pregunta anterior
      description: Vuelve atrás para cambiar la última respuesta. Falla con 400 si
        el recorrido aún no tiene respuestas.
      operationId: retroceder
      parameters:
      - name: recorridoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Recorrido actualizado en la pregunta anterior
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecorridoDTO"
        "400":
          description: El recorrido no tiene respuestas que deshacer
        "404":
          description: El recorrido no existe o es de otro padre
        "503":
          description: Caché de sesiones (Redis) no disponible
  /api/recorridos/{recorridoId}/respuestas:
    post:
      tags:
      - Consulta
      summary: Responde la pregunta actual
      description: Acepta tanto el formato de una sola opción (respuesta) como la
        selección múltiple (opciones); tipo es una pista opcional del cliente para
        la auditoría. Devuelve el recorrido actualizado.
      operationId: responder
      parameters:
      - name: recorridoId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespuestaRequest"
        required: true
      responses:
        "200":
          description: Respuesta registrada y recorrido actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecorridoDTO"
        "400":
          description: La opción enviada no es válida para la pregunta actual
        "404":
          description: El recorrido no existe o es de otro padre
        "503":
          description: Caché de sesiones (Redis) no disponible
  /api/autoria/subgrafos:
    get:
      tags:
      - Autoría
      summary: Lista los borradores de subgrafos
      description: Del último editado al primero.
      operationId: listar
      responses:
        "200":
          description: Resumen de cada borrador
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResumenSubgrafoDTO"
    post:
      tags:
      - Autoría
      summary: Crea un borrador de subgrafo
      description: Crea el borrador con el lienzo vacío.
      operationId: crear
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubgrafoRequest"
        required: true
      responses:
        "201":
          description: Borrador creado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "422":
          description: "Datos inválidos (por ejemplo, etiquetaOpcion vacía)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/despublicar:
    post:
      tags:
      - Autoría
      summary: Despublica el subgrafo
      description: "Solo supervisor. Las cuidadoras que empiecen un recorrido nuevo\
        \ ya no lo ven. Las que ya estaban en medio de un recorrido lo terminan. Se\
        \ retira también su base de reglas; el borrador del lienzo y el de reglas vuelven\
        \ a BORRADOR con su documento intacto."
      operationId: despublicar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Subgrafo despublicado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "403":
          description: Quien llama no es supervisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "404":
          description: El borrador no existe
        "409":
          description: Otra persona lo cambió al mismo tiempo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
        "422":
          description: "No está publicado, o era el único subgrafo publicado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/subgrafos/{id}/nodos:
    post:
      tags:
      - Autoría
      summary: Agrega un nodo (el "+")
      description: Crea la primera pregunta o un nodo después de una respuesta sin
        camino.
      operationId: agregarNodo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodoRequest"
        required: true
      responses:
        "200":
          description: Borrador actualizado con el nodo nuevo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubgrafoDTO"
        "404":
          description: El borrador no existe
        "422":
          description: La edición no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/bases:
    get:
      tags:
      - Reglas
      summary: Lista los borradores de reglas
      description: Del último editado al primero.
      operationId: listar_1
      responses:
        "200":
          description: Resumen de cada borrador
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResumenBaseReglaDTO"
    post:
      tags:
      - Reglas
      summary: Crea un borrador de reglas
      description: Crea la base vacía para el grafo indicado.
      operationId: crear_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseReglaRequest"
        required: true
      responses:
        "201":
          description: Borrador creado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseReglaDTO"
        "422":
          description: Datos inválidos o ya hay una base para ese grafo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/autoria/bases/{id}/reglas:
    post:
      tags:
      - Reglas
      summary: Agrega una regla al borrador
      operationId: agregarRegla
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReglaRequest"
        required: true
      responses:
        "200":
          description: Borrador actualizado con la regla nueva
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseReglaDTO"
        "404":
          description: El borrador no existe
        "422":
          description: La regla no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAutoriaDTO"
  /api/recorridos/{recorridoId}:
    get:
      tags:
      - Consulta
      summary: Consulta el estado del recorrido
      description: "Devuelve la pregunta actual si sigue en curso, o el resultado\
        \ final si ya terminó."
      operationId: consultar
      parameters:
      - name: recorridoId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Estado actual del recorrido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecorridoDTO"
        "404":
          description: El recorrido no existe o es de otro padre
        "503":
          description: Caché de sesiones (Redis) no disponible
  /api/autoria/subgrafos/{id}/avisos:
    get:
      tags:
      - Autoría
      summary: Avisos del lienzo
      description: Algunos bloquean la publicación y otros solo advierten.
      operationId: avisos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Avisos actuales
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Aviso"
        "404":
          description: El borrador no existe
  /api/autoria/categorias:
    get:
      tags:
      - Autoría
      summary: Categorías del grafo raíz
      description: Preguntas puente en las que se puede publicar un subgrafo.
      operationId: categorias
      responses:
        "200":
          description: Lista de categorías
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaDTO"
  /api/autoria/bases/{id}/avisos:
    get:
      tags:
      - Reglas
      summary: Avisos del borrador de reglas
      operationId: avisos_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Avisos actuales
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Aviso"
        "404":
          description: El borrador no existe
  /api/autoria/bases/catalogo:
    get:
      tags:
      - Reglas
      summary: Catálogo de nodos de un grafo
      description: Nodos y respuestas válidos para el editor de reglas. Para un subgrafo
        son ids locales; para el grafo raíz vienen prefijados.
      operationId: catalogo
      parameters:
      - name: grafoId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Catálogo del grafo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogoDTO"
        "404":
          description: El grafo no existe
        "422":
          description: No se indicó el grafo
components:
  schemas:
    LoginRequest:
      type: object
      description: Ingreso con correo y contraseña
      properties:
        correo:
          type: string
        contrasena:
          type: string
    RegistroRequest:
      type: object
      description: Registro de un padre o acudiente
      properties:
        nombre:
          type: string
        correo:
          type: string
        contrasena:
          type: string
          description: Mínimo 8 caracteres
    UsuarioDTO:
      type: object
      description: Cuenta de un usuario.
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          description: Nombre para mostrar
        correo:
          type: string
          description: Correo con el que ingresa
        rol:
          type: string
          enum:
          - PADRE
          - MEDICO
          - MEDICO_SUPERVISOR
        institucion:
          type: string
          description: "Institución del médico, o nula"
        activo:
          type: boolean
          description: Si puede ingresar
    SesionDTO:
      type: object
      description: Sesión abierta.
      properties:
        token:
          type: string
          description: "JWT para Authorization: Bearer"
        expiraEn:
          type: string
          format: date-time
          description: Cuándo vence el token
        usuario:
          $ref: "#/components/schemas/UsuarioDTO"
    NuevoUsuarioRequest:
      type: object
      description: Cuenta clínica nueva (solo MEDICO o MEDICO_SUPERVISOR)
      properties:
        nombre:
          type: string
        correo:
          type: string
        contrasena:
          type: string
          description: Mínimo 8 caracteres
        rol:
          type: string
          enum:
          - PADRE
          - MEDICO
          - MEDICO_SUPERVISOR
        institucion:
          type: string
    ActivoRequest:
      type: object
      description: Activa o desactiva una cuenta
      properties:
        activo:
          type: boolean
    RechazoRequest:
      type: object
      description: Rechazo de una revisión.
      properties:
        comentario:
          type: string
          description: Qué debe corregir el autor (obligatorio)
    ResumenRecorridoDTO:
      type: object
      description: "Fila de \"Mis recorridos\"."
      properties:
        recorridoId:
          type: string
          description: Id del recorrido
        estado:
          type: string
          description: EN_CURSO o FINALIZADO
        nivel:
          type: string
          description: "Nivel de alerta del resultado, o nulo si sigue en curso"
        mensaje:
          type: string
          description: "Mensaje de la conclusión, o nulo si sigue en curso"
        iniciadoEn:
          type: string
          format: date-time
          description: Cuándo empezó
        finalizadoEn:
          type: string
          format: date-time
          description: "Cuándo terminó, o nulo"
    SubgrafoRequest:
      type: object
      properties:
        nombre:
          type: string
          description: "Nombre técnico, que solo ven los médicos"
        puenteId:
          type: string
          description: Una de las categorías de GET /api/autoria/categorias
        etiquetaOpcion:
          type: string
          description: "Nombre para la familia, obligatorio: lo que verá la cuidadora"
        autor:
          type: string
          description: "Obsoleto: se ignora; el autor sale de la cuenta que llama"
          deprecated: true
        institucion:
          type: string
          description: "Obsoleto: se ignora; la institución sale de la cuenta que llama"
          deprecated: true
      required:
      - etiquetaOpcion
    Aviso:
      type: object
      description: "Aviso sobre el lienzo, escrito para el médico."
      properties:
        codigo:
          type: string
          description: Clase de aviso
          enum:
          - SIN_INICIO
          - TEXTO_VACIO
          - POCAS_RESPUESTAS
          - RESPUESTA_REPETIDA
          - RESPUESTA_SIN_CAMINO
          - SIN_DESENLACE
          - CICLO
          - NODO_SUELTO
          - REGLA_SIN_NOMBRE
          - REGLA_SIN_CONDICIONES
          - REGLA_SIN_DESTINO
          - REGLA_NIVEL_NORMAL
          - REGLA_CONDICION_INVALIDA
          - REGLA_DESTINO_INEXISTENTE
        bloqueante:
          type: boolean
          description: Si impide publicar
        mensaje:
          type: string
          description: Texto en lenguaje humano
        nodoId:
          type: string
          description: "Nodo al que se refiere, o nulo"
        respuestaId:
          type: string
          description: "Respuesta a la que se refiere, o nula"
    ErrorAutoriaDTO:
      type: object
      description: Cuerpo de un error de autoría (422 o 409).
      properties:
        mensaje:
          type: string
          description: Texto para el médico
        avisos:
          type: array
          description: Avisos que lo causan; vacía si no aplica
          items:
            $ref: "#/components/schemas/Aviso"
    NodoLienzo:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          description: Clase de nodo del lienzo.
          enum:
          - PREGUNTA
          - CONCLUSION
        texto:
          type: string
        variasRespuestas:
          type: boolean
        desenlace:
          type: string
          description: Desenlace de una conclusión.
          enum:
          - RECOMENDACION
          - CONSULTA_MEDICA
          - URGENCIA
        respuestas:
          type: array
          items:
            $ref: "#/components/schemas/RespuestaLienzo"
    RespuestaLienzo:
      type: object
      properties:
        id:
          type: string
        texto:
          type: string
        gravedad:
          type: string
          description: Gravedad de una respuesta (semáforo del lienzo).
          enum:
          - LEVE
          - MODERADA
          - GRAVE
        destino:
          type: string
    SubgrafoDTO:
      type: object
      description: "Borrador completo: sus datos, el lienzo y los avisos. Lo devuelven\
        \ todas las operaciones que editan."
      properties:
        id:
          type: integer
          format: int64
          description: Id del borrador
        grafoId:
          type: string
          description: Id del subgrafo publicado (grafo_...)
        nombre:
          type: string
          description: Nombre técnico del subgrafo
        puenteId:
          type: string
          description: Pregunta puente del grafo raíz donde se ofrece
        categoria:
          type: string
          description: Categoría del subgrafo
        etiquetaOpcion:
          type: string
          description: Texto de la opción en la pregunta puente
        autor:
          type: string
          description: Autor del contenido
        institucion:
          type: string
          description: Institución del autor
        estado:
          type: string
          description: "Estado: BORRADOR, PUBLICADO, CAMBIOS_SIN_PUBLICAR o EN_REVISION"
          enum:
          - BORRADOR
          - PUBLICADO
          - CAMBIOS_SIN_PUBLICAR
          - EN_REVISION
        inicio:
          type: string
          description: "Id de la primera pregunta, o nulo"
        nodos:
          type: array
          description: Nodos del lienzo en el orden en que se crearon
          items:
            $ref: "#/components/schemas/NodoLienzo"
        avisos:
          type: array
          description: Avisos actuales del lienzo
          items:
            $ref: "#/components/schemas/Aviso"
        creadoEn:
          type: string
          format: date-time
          description: Fecha de creación
        actualizadoEn:
          type: string
          format: date-time
          description: Fecha de la última edición
        publicadoEn:
          type: string
          format: date-time
          description: "Fecha de la última publicación, o nula"
        autorId:
          type: integer
          format: int64
          description: "Id de la cuenta del autor, o nulo"
        comentarioRevision:
          type: string
          description: "Comentario del supervisor si rechazó la última revisión, o nulo"
        revisadoEn:
          type: string
          format: date-time
          description: "Cuándo se aprobó o rechazó la última revisión, o nulo"
    DestinoRequest:
      type: object
      description: Pregunta existente destino de una respuesta; nodoId nulo quita
        el enlace.
      properties:
        nodoId:
          type: string
          description: "Id de la pregunta existente, o nulo para quitar el enlace"
    DespuesDeRequest:
      type: object
      description: Respuesta del lienzo después de la cual se agrega un nodo.
      properties:
        nodoId:
          type: string
          description: Id del nodo que contiene la respuesta
        respuestaId:
          type: string
          description: Id de la respuesta cuyo "+" se tocó
    NodoRequest:
      type: object
      properties:
        despuesDe:
          $ref: "#/components/schemas/DespuesDeRequest"
          description: "Al crear, la respuesta cuyo \"+\" se tocó; nulo para la primera\
            \ pregunta. Al editar se ignora."
        tipo:
          type: string
          description: "Tipo de nodo; obligatorio al crear, puede omitirse al editar"
          enum:
          - PREGUNTA
          - CONCLUSION
        texto:
          type: string
          description: Texto de la pregunta o conclusión
        variasRespuestas:
          type: boolean
          description: Si la pregunta admite selección múltiple
        desenlace:
          type: string
          description: Desenlace; solo para conclusiones
          enum:
          - RECOMENDACION
          - CONSULTA_MEDICA
          - URGENCIA
        respuestas:
          type: array
          description: "Respuestas; solo para preguntas. Al editar, las que traen\
            \ id conservan su destino"
          items:
            $ref: "#/components/schemas/OpcionRequest"
    OpcionRequest:
      type: object
      description: Respuesta de una pregunta.
      properties:
        id:
          type: string
          description: Id de la respuesta; solo al editar una que ya existe
        texto:
          type: string
          description: Texto de la opción
        gravedad:
          type: string
          description: Gravedad asociada a la opción
          enum:
          - LEVE
          - MODERADA
          - GRAVE
    BaseReglaRequest:
      type: object
      properties:
        nombre:
          type: string
          description: "Nombre de la base de reglas, para el tablero"
        descripcion:
          type: string
          description: "Descripción de la base de reglas, para el tablero"
        grafoId:
          type: string
          description: Grafo publicado al que pertenecen las reglas (grafo_raiz o
            un subgrafo)
        autor:
          type: string
          description: "Obsoleto: se ignora; el autor sale de la cuenta que llama"
          deprecated: true
        institucion:
          type: string
          description: "Obsoleto: se ignora; la institución sale de la cuenta que llama"
          deprecated: true
    BaseReglaDTO:
      type: object
      description: Borrador completo de una base de reglas.
      properties:
        id:
          type: integer
          format: int64
          description: Id del borrador
        grafoId:
          type: string
          description: Grafo publicado al que pertenecen las reglas
        nombre:
          type: string
          description: Nombre de la base de reglas
        descripcion:
          type: string
          description: Descripción de la base de reglas
        autor:
          type: string
          description: Autor del contenido
        institucion:
          type: string
          description: Institución del autor
        estado:
          type: string
          description: "Estado: BORRADOR, PUBLICADO, CAMBIOS_SIN_PUBLICAR o EN_REVISION"
          enum:
          - BORRADOR
          - PUBLICADO
          - CAMBIOS_SIN_PUBLICAR
          - EN_REVISION
        reglas:
          type: array
          description: "Reglas del borrador, en orden"
          items:
            $ref: "#/components/schemas/ReglaDTO"
        avisos:
          type: array
          description: Avisos actuales
          items:
            $ref: "#/components/schemas/Aviso"
        creadoEn:
          type: string
          format: date-time
          description: Fecha de creación
        actualizadoEn:
          type: string
          format: date-time
          description: Fecha de la última edición
        publicadoEn:
          type: string
          format: date-time
          description: "Fecha de la última publicación, o nula"
        autorId:
          type: integer
          format: int64
          description: "Id de la cuenta del autor, o nulo"
    Condicion:
      type: object
      properties:
        idNodo:
          type: string
        respuesta:
          type: string
    ReglaDTO:
      type: object
      description: Regla de una base de reglas.
      properties:
        id:
          type: string
          description: Id de la regla
        nombre:
          type: string
          description: Nombre de la regla
        descripcion:
          type: string
          description: Explicación para el médico
        casos:
          type: array
          description: "FND: lista de casos (OR), cada caso una lista de condiciones\
            \ (AND)"
          items:
            type: array
            items:
              $ref: "#/components/schemas/Condicion"
        nivel:
          type: string
          description: Nivel de alerta
          enum:
          - NORMAL
          - CONSULTAR_MEDICO
          - URGENCIA
        nodoDestino:
          type: string
          description: Id del nodo destino
    ReglaRequest:
      type: object
      properties:
        nombre:
          type: string
          description: Nombre de la regla
        descripcion:
          type: string
          description: Explicación para el médico
        casos:
          type: array
          description: "FND: lista de casos (OR), cada caso una lista de condiciones\
            \ (AND)"
          items:
            type: array
            items:
              $ref: "#/components/schemas/Condicion"
        nivel:
          type: string
          description: "Nivel de alerta al dispararse: CONSULTAR_MEDICO o URGENCIA"
          enum:
          - NORMAL
          - CONSULTAR_MEDICO
          - URGENCIA
        nodoDestino:
          type: string
          description: Id del nodo destino
    PasoCausalDTO:
      type: object
      description: Un paso del camino causal hacia el desenlace.
      properties:
        nodoId:
          type: string
          description: Id del nodo alcanzado
        condicion:
          type: string
          description: Condición de la arista por la que se llegó; vacía para el nodo
            inicial
    PreguntaDTO:
      type: object
      description: Pregunta que el recorrido presenta al cuidador mientras está en
        curso.
      properties:
        id:
          type: string
          description: Id del nodo pregunta
        texto:
          type: string
          description: Contenido de la pregunta
        opciones:
          type: array
          description: Etiquetas de las respuestas válidas
          items:
            type: string
        tieneImagenes:
          type: boolean
          description: Si la pregunta tiene imágenes de apoyo
        imagenes:
          type: array
          description: Rutas de las imágenes; vacía si no tiene
          items:
            type: string
        tipoInteraccion:
          type: string
          description: "Tipo de interacción: SI_NO, SELECCION_UNICA o SELECCION_MULTIPLE"
    RecomendacionDTO:
      type: object
      description: "Una recomendación alcanzada durante el recorrido, con su propio\
        \ camino causal."
      properties:
        nodoId:
          type: string
          description: Id del nodo de recomendación
        mensaje:
          type: string
          description: Contenido de la recomendación
        caminoCausal:
          type: array
          description: Camino de preguntas y respuestas que llevó a ella
          items:
            $ref: "#/components/schemas/PasoCausalDTO"
    RecorridoDTO:
      type: object
      description: Vista de un recorrido de triaje. Si estado es EN_CURSO lleva pregunta
        y resultado es nulo; si es FINALIZADO lleva resultado y pregunta es nulo.
      properties:
        recorridoId:
          type: string
          description: Id de la sesión de recorrido
        estado:
          type: string
          description: EN_CURSO o FINALIZADO
        pregunta:
          $ref: "#/components/schemas/PreguntaDTO"
          description: Pregunta actual; solo si el recorrido está en curso
        resultado:
          $ref: "#/components/schemas/ResultadoDTO"
          description: Desenlace; solo si el recorrido finalizó
    ResultadoDTO:
      type: object
