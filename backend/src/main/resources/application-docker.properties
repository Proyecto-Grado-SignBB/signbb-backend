# Base de datos PostgreSQL (el host 'db' es el nombre del servicio en docker-compose)
# Con el backend en el host se usan los valores de desarrollo; en el contenedor
# (servicio "backend" de contenedores/compose.yaml) llegan por variables de entorno.
spring.datasource.url=${SIGNBB_DB_URL:jdbc:postgresql://localhost:5432/signbb}
spring.datasource.username=${SIGNBB_DB_USUARIO:admin}
spring.datasource.password=${SIGNBB_DB_CONTRASENA:example}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Cache Redis (servicio "cache" de contenedores/compose.yaml, perfil docker)
spring.data.redis.host=${SIGNBB_REDIS_HOST:localhost}
spring.data.redis.port=${SIGNBB_REDIS_PUERTO:6379}

# Silo (servicio "silo" de contenedores/compose.yaml): almacén S3 de imágenes.
# Credenciales SOLO de desarrollo; en producción van por variables de entorno.
signbb.media.endpoint=${SIGNBB_MEDIA_ENDPOINT:http://localhost:9000}
signbb.media.access-key=${SIGNBB_MEDIA_ACCESS_KEY:silo-admin}
signbb.media.secret-key=${SIGNBB_MEDIA_SECRET_KEY:ejemplo123}
signbb.media.bucket=${SIGNBB_MEDIA_BUCKET:signbb-imagenes}
