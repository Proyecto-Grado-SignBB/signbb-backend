# Base de datos PostgreSQL (el host 'db' es el nombre del servicio en docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/signbb
spring.datasource.username=admin
spring.datasource.password=example
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Cache Redis (servicio "cache" de contenedores/compose.yaml, perfil docker)
spring.data.redis.host=localhost
spring.data.redis.port=6379