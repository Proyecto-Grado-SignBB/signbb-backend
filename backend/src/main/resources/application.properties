spring.application.name=backend
# Crear/actualizar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
# Mostrar SQL en consola
spring.jpa.show-sql=true
# Cache Redis (servicio "cache" de contenedores/compose.yaml): timeouts cortos
# para no colgar la resolución de contenido si el cache no responde
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=1s
# Perfil único: PostgreSQL y Redis de contenedores/compose.yaml
spring.profiles.active=docker
# Banner de CLI, cambiar cuando tengamos nombre final
spring.banner.location=classpath:static/banner.txt
# Navegación: máximo de preguntas respondidas sin llegar a un terminal; al
# alcanzarlo el recorrido cierra con una recomendación general (NORMAL)
signbb.navegacion.max-preguntas=10
