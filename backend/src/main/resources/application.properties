spring.application.name=backend
# Crear/actualizar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
# Mostrar SQL en consola
spring.jpa.show-sql=true
# Cache Redis (servicio "cache" de contenedores/compose.yaml): timeouts cortos
# para no colgar la resolución de contenido si el cache no responde
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=1s
# Perfil único: PostgreSQL y Redis de contenedores/compose.yaml
spring.profiles.active=docker
# Banner de CLI, cambiar cuando tengamos nombre final
spring.banner.location=classpath:static/banner.txt
# Navegación: máximo de preguntas respondidas sin llegar a un terminal; al
# alcanzarlo el recorrido cierra con una recomendación general (NORMAL)
signbb.navegacion.max-preguntas=10

# Documentación OpenAPI (springdoc): contrato en /v3/api-docs(.yaml) y
# Swagger UI en /swagger-ui.html. La copia versionada es docs/api/openapi.yaml.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# springdoc trae Jackson 2 al classpath; sin esto Hibernate usaría su mapper de
# Jackson 2 para las columnas jsonb y no entiende los JsonNode de Jackson 3
# (tools.jackson). Se fuerza el mapper de Jackson 3.
spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

# Imágenes de las preguntas: tope por archivo (1 MB) y límite de subida del
# servidor (un poco mayor, para que el mensaje claro lo dé la aplicación)
signbb.media.max-bytes=1048576
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Limpieza diaria: borra versiones viejas del contenido (conserva las 20 más
# recientes y las reemplazadas hace menos de 25 h) e imágenes sin uso (nunca
# las subidas hace menos de 24 h). Hora en formato cron de Spring (3:30 a. m.).
signbb.limpieza.activa=true
signbb.limpieza.cron=0 30 3 * * *

# Seguridad: JWT firmado con HS256 (el secreto debe tener al menos 32 bytes;
# en producción se define con SIGNBB_JWT_SECRETO) y supervisor inicial, que se
# crea al arrancar solo si no existe ningún MEDICO_SUPERVISOR.
signbb.seguridad.jwt.secreto=${SIGNBB_JWT_SECRETO:signbb-desarrollo-secreto-cambiar-en-produccion-2026}
# Duración del token: médicos y supervisores (duracion), padres (duracion-familia)
# y padres que ingresan desde un dispositivo seguro (duracion-familia-segura)
signbb.seguridad.jwt.duracion=8h
signbb.seguridad.jwt.duracion-familia=24h
signbb.seguridad.jwt.duracion-familia-segura=30d
# Ingreso: tras este número de intentos fallidos seguidos con un correo, ese
# correo queda bloqueado el tiempo indicado (contado desde el último fallo)
signbb.seguridad.login.max-intentos=5
signbb.seguridad.login.bloqueo=15m
signbb.seguridad.supervisor-inicial.nombre=${SIGNBB_SUPERVISOR_NOMBRE:Supervisor SignBB}
signbb.seguridad.supervisor-inicial.correo=${SIGNBB_SUPERVISOR_CORREO:supervisor@signbb.local}
signbb.seguridad.supervisor-inicial.contrasena=${SIGNBB_SUPERVISOR_CONTRASENA:Supervisor123}
# Orígenes del front que pueden llamar a la API (autoría y consulta)
signbb.seguridad.cors.origenes=${SIGNBB_CORS_ORIGENES:http://localhost:4200,http://localhost:4300}
