# =============================================================================
# Docker Compose para SignBB - Servicios de Base de Datos
# =============================================================================
# Este archivo define los servicios de PostgreSQL y Adminer.
# Se ejecuta con: docker compose up -d
# =============================================================================

services:

  # ===========================================================================
  # SERVICIO: db (PostgreSQL)
  # ===========================================================================
  # Base de datos relacional principal del sistema SignBB.
  # Almacena: grafos clínicos, reglas, credenciales, historiales y observaciones.
  # ===========================================================================
  db:
    # Imagen oficial de PostgreSQL, versión 16 con Alpine Linux (más ligera).
    # Alpine reduce el tamaño de la imagen (~80 MB vs ~400 MB de la versión Debian).
    image: postgres:16-alpine

    # Política de reinicio: si el contenedor falla, Docker lo reinicia automáticamente.
    # "always" garantiza que la base de datos esté disponible tras reinicios del host.
    restart: always

    # Memoria compartida (shared memory) para PostgreSQL.
    # PostgreSQL usa /dev/shm para operaciones paralelas (ej. sorts, joins).
    # Docker limita esto a 64 MB por defecto, lo que puede causar errores.
    # 128 MB es suficiente para el volumen de datos de SignBB.
    shm_size: 128mb

    # Variables de entorno que PostgreSQL lee al inicializarse por primera vez.
    # Solo se aplican si el volumen de datos está vacío (primera ejecución).
    environment:
      # Superusuario de PostgreSQL (por defecto sería "postgres").
      # Se usa "admin" para seguir la convención del proyecto.
      POSTGRES_USER: admin

      # Contraseña del superusuario.
      # En producción, usar un secreto gestionado (Docker Secrets, Vault, etc.).
      POSTGRES_PASSWORD: example

      # Base de datos que se crea automáticamente al inicializar.
      # Si no se especifica, PostgreSQL crea una base de datos con el nombre del usuario.
      POSTGRES_DB: signbb

    # Mapeo de puertos: host:contenedor
    # Expone el puerto 5432 de PostgreSQL al puerto 5432 del host.
    # Necesario para conectarse desde herramientas externas (ej. DBeaver, psql).
    # En producción, se puede omitir si solo el backend accede a la BD.
    # Se publica solo en 127.0.0.1: desde otro computador de la red no se llega.
    ports:
      - "127.0.0.1:5432:5432"

    # Volumen para persistir los datos de PostgreSQL.
    # Sin esto, los datos se pierden al eliminar el contenedor.
    # El volumen "postgres_data" es gestionado por Docker (named volume).
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Healthcheck: verifica que PostgreSQL esté listo para aceptar conexiones.
    # Docker ejecuta este comando periódicamente dentro del contenedor.
    # "pg_isready" es la herramienta oficial de PostgreSQL para verificar disponibilidad.
    healthcheck:
      # Comando que se ejecuta para verificar el estado.
      # -U admin: verifica con el usuario admin.
      # -d signbb: verifica la base de datos signbb.
      test: ["CMD-SHELL", "pg_isready -U admin -d signbb"]

      # Intervalo entre verificaciones: cada 10 segundos.
      interval: 10s

      # Tiempo máximo de espera por una respuesta: 5 segundos.
      timeout: 5s

      # Número de intentos fallidos antes de marcar el contenedor como "unhealthy".
      retries: 5

      # Tiempo de gracia antes de empezar a verificar: 30 segundos.
      # PostgreSQL tarda unos segundos en inicializar y estar listo.
      start_period: 30s

  # ===========================================================================
  # SERVICIO: adminer (Cliente de Base de Datos Web)
  # ===========================================================================
  # Interfaz web ligera para administrar PostgreSQL desde el navegador.
  # Útil para desarrollo, pruebas y depuración de la base de datos.
  # NO se recomienda exponerlo en producción sin autenticación.
  # ===========================================================================
  adminer:
    # Imagen oficial de Adminer (cliente de BD web, similar a phpMyAdmin).
    image: adminer

    # Política de reinicio: si el contenedor falla, Docker lo reinicia.
    restart: always

    # Mapeo de puertos: expone Adminer en http://localhost:8180
    # El puerto 8180 del host se mapea al 8080 del contenedor.
    # Solo en 127.0.0.1; en producción no se debe desplegar Adminer.
    ports:
      - "127.0.0.1:8180:8080"

    # Variable de entorno que indica a Adminer el servidor por defecto.
    # Sin esto, Adminer intentaría conectarse a "localhost" (sí mismo).
    # "db" es el nombre del servicio de PostgreSQL en esta red de Docker.
    environment:
      ADMINER_DEFAULT_SERVER: db

    # Dependencia: Adminer espera a que PostgreSQL esté saludable.
    # "condition: service_healthy" hace que Docker espere a que el healthcheck
    # de PostgreSQL pase antes de iniciar Adminer.
    # Esto evita errores de conexión al abrir Adminer inmediatamente.
    depends_on:
      db:
        condition: service_healthy


  # ===========================================================================
  # SERVICIO: SILO (Almacenamiento de objetos)
  # ===========================================================================
  # Almacenamiento de objetos compatible con la API de Amazon S3
  # Almacena: Fotografias, multimedia
  # ===========================================================================
  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    container_name: silo

    # Política de reinicio: igual que db y adminer, el servicio vuelve tras
    # reinicios del host.
    restart: always

    # Sirve los objetos desde /data y expone la consola web en el puerto 9001.
    command: server /data --console-address ":9001"

    # Solo en 127.0.0.1: la API S3 y la consola no se ven desde la red.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      # Credenciales raíz del almacenamiento (solo desarrollo).
      # MINIO_ROOT_PASSWORD debe tener 8+ caracteres (la imagen lo exige).
      MINIO_ROOT_USER: silo-admin
      MINIO_ROOT_PASSWORD: ejemplo123

    # Volumen nombrado para persistir los objetos.
    # Debe montarse en /data: es la ruta que sirve el comando "server" y el
    # VOLUME declarado por la imagen. Montarla en otra ruta rompe la
    # persistencia (los objetos quedarían fuera del volumen nombrado).
    volumes:
      - silo_data:/data

    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # SERVICIO: cache (Redis)
  # ===========================================================================
  # Caché distribuida en memoria para los motores de navegación y reglas
  # (según el documento de diseño). Guarda el contenido clínico activo
  # (grafo y reglas) como copia caliente de lo que vive en PostgreSQL y las
  # sesiones temporales de los recorridos en curso, evitando lecturas
  # repetidas a la base y permitiendo que las consultas sobrevivan reinicios
  # del backend.
  # ===========================================================================
  cache:
    # Imagen oficial de Redis 8 con Alpine Linux (ligera).
    image: redis:8-alpine

    # Política de reinicio: igual que db y silo, el servicio vuelve tras
    # reinicios del host.
    restart: always

    # AOF: persiste las escrituras en el volumen para que las sesiones
    # sobrevivan reinicios del propio contenedor (no es solo caché volátil).
    command: redis-server --appendonly yes

    # Mapeo de puertos: expone Redis en localhost:6379 para el backend (que
    # corre en el host durante el desarrollo) y para redis-cli / RedisInsight.
    # Solo en 127.0.0.1: Redis no tiene contraseña y no debe verse desde la red.
    ports:
      - "127.0.0.1:6379:6379"

    # Volumen nombrado para el AOF de Redis.
    volumes:
      - redis_data:/data

    # Healthcheck: Redis responde PONG mientras acepte comandos.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# =============================================================================
# VOLÚMENES
# =============================================================================
# Los volúmenes nombrados son gestionados por Docker y persisten los datos
# incluso si los contenedores se eliminan (docker compose down).
# Solo se eliminan con: docker compose down -v
# =============================================================================
volumes:
  # Volumen para los datos de PostgreSQL.
  # Almacena: tablas, índices, configuraciones, WAL, etc.
  postgres_data:

  # Volumen para los datos de SILO
  silo_data:

  # Volumen para el AOF de Redis (cache y sesiones)
  redis_data:
